<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17110d">
  <title>Terri Burgers | Pedidos</title>
  <style>
    :root{--red:#d91f2e;--yellow:#ffca28;--ink:#17110d;--cream:#fff8ee;--muted:#806f65;--line:#eadbd0;--card:#fff;--rate:876.79}
    *{box-sizing:border-box} body{margin:0;background:#fff4e8;color:var(--ink);font-family:Arial,Helvetica,sans-serif;padding-bottom:102px}
    header{background:radial-gradient(circle at 85% 5%,#ffca28 0 5%,transparent 5.2%),linear-gradient(135deg,#21140f,#4a180e);color:white;padding:22px 16px 25px;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px #40100555}
    .brand{display:flex;align-items:center;gap:11px;max-width:880px;margin:auto}.logo{height:48px;width:48px;display:grid;place-items:center;border-radius:14px;background:var(--yellow);font-size:27px;box-shadow:0 2px 0 #ab7610}.brand h1{font-size:24px;margin:0;letter-spacing:-.6px}.brand p{margin:2px 0 0;font-size:12px;color:#ffe8ba}.cart-badge{margin-left:auto;background:var(--red);border:1px solid #ff7882;padding:9px 10px;border-radius:14px;font-size:13px;cursor:pointer}
    main{max-width:880px;margin:auto;padding:16px}.notice{border-radius:13px;background:#fff3c9;border:1px solid #f0d67a;padding:10px 12px;font-size:12px;color:#684d02;margin-bottom:15px}.search{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:14px;font-size:15px;outline:none;background:#fff;margin-bottom:16px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;white-space:nowrap;color:#4c362c;cursor:pointer}.tab.active{background:var(--red);color:#fff;border-color:var(--red)}
    h2{font-size:20px;margin:22px 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:13px}.product{background:var(--card);border:1px solid #f0e2d8;border-radius:18px;overflow:hidden;box-shadow:0 5px 18px #8a4a2411;display:flex;flex-direction:column}.food{height:110px;display:grid;place-items:center;font-size:64px;background:linear-gradient(135deg,#ffefd8,#ffe4bc)}.product:nth-child(3n+2) .food{background:linear-gradient(135deg,#f8e8ff,#edd3f6)}.product:nth-child(3n) .food{background:linear-gradient(135deg,#e5f6ec,#ceedd9)}.body{padding:13px}.type{font-size:10px;font-weight:bold;color:var(--red);letter-spacing:.5px;text-transform:uppercase}.name{font-size:16px;font-weight:bold;margin:5px 0}.desc{font-size:12px;color:var(--muted);min-height:30px}.price{font-weight:bold;margin:11px 0 9px}.bs{display:block;font-weight:normal;color:#7c6153;font-size:12px;margin-top:3px}.add{width:100%;background:var(--red);border:0;border-radius:10px;padding:11px;color:white;font-weight:bold;cursor:pointer}.add:hover{filter:brightness(.94)}
    .cartbar{position:fixed;bottom:0;left:0;right:0;background:#fffdfb;border-top:1px solid var(--line);z-index:7;padding:12px 16px}.cart-inner{max-width:880px;margin:auto;display:flex;align-items:center;gap:12px}.cart-total{flex:1;font-size:13px}.cart-total strong{display:block;font-size:17px}.checkout{border:0;background:#1fb95a;color:white;border-radius:12px;padding:14px 17px;font-weight:bold;cursor:pointer}.checkout:disabled{opacity:.48;cursor:not-allowed}
    dialog{border:0;border-radius:20px;padding:0;max-width:560px;width:calc(100% - 28px);box-shadow:0 18px 70px #0008}dialog::backdrop{background:#21120d99}.modal{padding:18px;max-height:88vh;overflow:auto}.close{float:right;border:0;background:#f4e6df;border-radius:50%;height:32px;width:32px;font-size:20px;cursor:pointer}.modal h3{margin:3px 38px 5px 0;font-size:23px}.modal .base{color:var(--muted);margin-top:0}.options{margin:18px 0}.options h4{font-size:14px;margin:17px 0 8px}.choice{display:flex;gap:8px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer;font-size:14px}.choice input{accent-color:var(--red)}.note{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;resize:vertical;font:inherit}.qty{display:flex;align-items:center;gap:13px;margin:14px 0}.qty button{width:34px;height:34px;border:0;border-radius:9px;background:#f1e2db;font-size:20px;cursor:pointer}.qty b{min-width:14px;text-align:center}.modal-add{width:100%;border:0;background:var(--red);border-radius:11px;padding:14px;color:#fff;font-weight:bold;font-size:15px;cursor:pointer}
    .cartitem{border-bottom:1px solid var(--line);padding:12px 0}.cartitem:last-of-type{border-bottom:0}.cartitem-top{display:flex;gap:8px;justify-content:space-between}.cartitem small{color:var(--muted);display:block;margin-top:3px}.remove{border:0;color:var(--red);background:transparent;font-size:12px;cursor:pointer;padding:0;margin-top:5px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid input,.formgrid select,.formgrid textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);font:inherit}.formgrid label{font-size:12px;font-weight:bold}.formgrid .wide{grid-column:1/-1}.whatsapp{width:100%;margin-top:16px;border:0;background:#1fb95a;border-radius:11px;padding:14px;color:white;font-weight:bold;font-size:15px;cursor:pointer}.empty{text-align:center;color:var(--muted);padding:25px}.hidden{display:none}@media(max-width:430px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.food{height:88px;font-size:51px}.body{padding:10px}.name{font-size:14px}.desc{font-size:11px}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}}
  </style>
</head>
<body>
<header><div class="brand"><div class="logo">🍔</div><div><h1>Terri Burgers</h1><p>Date un gustazo · Pedidos rápidos</p></div><button class="cart-badge" onclick="openCart()">🛒 <span id="cartCount">0</span></button></div></header>
<main>
  <div class="notice">💵 Precios en USD y bolívares. Tasa referencial editable: <b id="rateText"></b> por US$1.</div>
  <input id="search" class="search" placeholder="¿Qué producto buscas?" oninput="renderProducts()">
  <div class="tabs" id="tabs"></div>
  <h2 id="sectionTitle">Todo el menú</h2><div class="grid" id="products"></div>
</main>
<div class="cartbar"><div class="cart-inner"><div class="cart-total"><span id="cartLabel">Tu carrito está vacío</span><strong id="cartTotal">US$0,00 · Bs. 0,00</strong></div><button class="checkout" id="checkout" disabled onclick="openCart()">Ver pedido</button></div></div>
<dialog id="productDialog"><div class="modal"><button class="close" onclick="productDialog.close()">×</button><h3 id="modalTitle"></h3><p class="base" id="modalBase"></p><div class="options" id="modalOptions"></div><h4>Observaciones</h4><textarea id="note" class="note" rows="3" placeholder="Ej.: poca salsa, bien tostado…"></textarea><div class="qty"><button onclick="changeQty(-1)">−</button><b id="qtyValue">1</b><button onclick="changeQty(1)">+</button></div><button class="modal-add" onclick="addConfigured()">Añadir al carrito</button></div></dialog>
<dialog id="cartDialog"><div class="modal"><button class="close" onclick="cartDialog.close()">×</button><h3>Tu pedido</h3><div id="cartItems"></div><div id="customerForm" class="hidden"><h4>Datos para el pedido</h4><div class="formgrid"><label>Nombre<input id="custName" placeholder="Tu nombre"></label><label>Teléfono<input id="custPhone" type="tel" placeholder="Ej.: 0414 0000000"></label><label>Entrega<select id="delivery" onchange="toggleAddress()"><option value="Domicilio">Domicilio</option><option value="Retiro en el local">Retiro en el local</option></select></label><label>Pago<select id="payment"><option>Efectivo USD</option><option>Bolívares</option><option>Pago móvil</option><option>Transferencia</option><option>Binance</option></select></label><label id="addressLabel" class="wide">Dirección y referencia<textarea id="address" rows="2" placeholder="Sector, calle, casa y punto de referencia"></textarea></label><label class="wide">Nota adicional<textarea id="orderNote" rows="2" placeholder="Ej.: llamar al llegar"></textarea></label></div><button class="whatsapp" onclick="sendWhatsApp()">Enviar pedido por WhatsApp</button></div></div></dialog>
<script>
const RATE=876.79, PHONE='584145530136';
const products=[
 {id:'whopper-mini',cat:'Hamburguesas',name:'Whopper Mini',price:2.50,emoji:'🍔',desc:'Carne, queso, vegetales y salsas'},
 {id:'whopper-clasica',cat:'Hamburguesas',name:'Whopper Clásica',price:3.50,emoji:'🍔',desc:'Carne, jamón, queso, vegetales y salsas'},
 {id:'terri-sencilla',cat:'Hamburguesas',name:'Terri Sencilla',price:5.00,emoji:'🍔',desc:'Carne, jamón, queso, vegetales y salsas de la casa'},
 {id:'terri-especial',cat:'Hamburguesas',name:'Terri Especial',price:6.50,emoji:'🍔',desc:'Carne, huevo, tocineta, queso y vegetales'},
 {id:'pan-peq',cat:'Perros calientes',name:'Pan Pequeño',price:1.50,emoji:'🌭',desc:'Salchicha, vegetales y salsas'},
 {id:'pan-grande',cat:'Perros calientes',name:'Pan Grande',price:2.00,emoji:'🌭',desc:'Salchicha, vegetales y salsas'},
 {id:'peq-huevo',cat:'Perros calientes',name:'Pequeño con Huevo',price:2.50,emoji:'🌭',desc:'Salchicha, huevo, vegetales y salsas'},
 {id:'grande-supremo',cat:'Perros calientes',name:'Grande Supremo',price:3.50,emoji:'🌭',desc:'Salchicha, huevo, tocineta y vegetales'},
 {id:'chori',cat:'Perros calientes',name:'Chori Terri',price:4.00,emoji:'🌭',desc:'Chorizo, vegetales y salsas'},
 {id:'perro-especial',cat:'Perros calientes',name:'Perro Especial',price:5.50,emoji:'🌭',desc:'Salchicha, tocineta, queso y vegetales'},
 {id:'combo',cat:'Combos',name:'Combo Terri',price:8.00,emoji:'🥤',desc:'Perro especial + bebida'},
 {id:'sum',cat:'Bebidas',name:'Refresco Sum',price:1.00,emoji:'🥤',desc:'Bebida individual'}
];
const extras=[{group:'Cebolla',type:'radio',key:'onion',items:[['Sin cebolla',0],['Poca cebolla',0],['Cebolla normal',0],['Mucha cebolla',.25]]},{group:'Salsas',type:'check',key:'sauces',items:[['Kétchup',0],['Mayonesa',0],['Mostaza',0],['Salsa rosada',0],['Salsa de ajo',0]]},{group:'Extras',type:'check',key:'extras',items:[['Queso extra',.75],['Huevo extra',.75],['Tocineta extra',1],['Carne extra',2]]}];
let active='Todo', selected=null, qty=1, cart=[];
const money=n=>'US$'+n.toFixed(2).replace('.',','); const bs=n=>'Bs. '+(n*RATE).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2});
rateText.textContent=bs(1);
function categories(){return ['Todo',...new Set(products.map(p=>p.cat))]}
function renderTabs(){tabs.innerHTML=categories().map(c=>`<button class="tab ${active===c?'active':''}" onclick="active='${c}';renderTabs();renderProducts()">${c}</button>`).join('')}
function renderProducts(){let q=search.value.toLowerCase().trim();let list=products.filter(p=>(active==='Todo'||p.cat===active)&&(`${p.name} ${p.desc}`.toLowerCase().includes(q)));sectionTitle.textContent=active==='Todo'?'Todo el menú':active;productsEl=document.getElementById('products');productsEl.innerHTML=list.length?list.map(p=>`<article class="product"><div class="food">${p.emoji}</div><div class="body"><div class="type">${p.cat}</div><div class="name">${p.name}</div><div class="desc">${p.desc}</div><div class="price">${money(p.price)}<span class="bs">${bs(p.price)}</span></div><button class="add" onclick="configure('${p.id}')">Personalizar</button></div></article>`).join(''):'<p class="empty">No encontramos ese producto.</p>'}
function configure(id){selected=products.find(x=>x.id===id);qty=1;modalTitle.textContent=selected.name;modalBase.textContent=`Precio base: ${money(selected.price)} · ${bs(selected.price)}`;qtyValue.textContent=qty;note.value='';modalOptions.innerHTML=extras.map(g=>`<h4>${g.group}</h4>${g.items.map((it,i)=>`<label class="choice"><input type="${g.type==='radio'?'radio':'checkbox'}" name="${g.key}" value="${it[0]}" data-price="${it[1]}" ${g.type==='radio'&&i===2?'checked':''}> ${it[0]}${it[1]?` <span style="margin-left:auto;color:#7c6153">+${money(it[1])}</span>`:''}</label>`).join('')}`).join('');productDialog.showModal()}
function changeQty(n){qty=Math.max(1,qty+n);qtyValue.textContent=qty}
function addConfigured(){let selectedOptions=[];modalOptions.querySelectorAll('input:checked').forEach(x=>selectedOptions.push({name:x.value,price:+x.dataset.price}));let extraTotal=selectedOptions.reduce((a,x)=>a+x.price,0);cart.push({id:Date.now(),name:selected.name,base:selected.price,qty,options:selectedOptions,note:note.value.trim(),unit:selected.price+extraTotal});productDialog.close();updateCart()}
function updateCart(){let count=cart.reduce((a,x)=>a+x.qty,0), total=cart.reduce((a,x)=>a+x.unit*x.qty,0);cartCount.textContent=count;cartLabel.textContent=count?`${count} producto${count!==1?'s':''} en el carrito`:'Tu carrito está vacío';cartTotal.textContent=`${money(total)} · ${bs(total)}`;checkout.disabled=!cart.length}
function openCart(){if(!cart.length)return;customerForm.classList.add('hidden');renderCart();cartDialog.showModal()}
function renderCart(){let total=cart.reduce((a,x)=>a+x.unit*x.qty,0);cartItems.innerHTML=cart.map(x=>`<div class="cartitem"><div class="cartitem-top"><b>${x.qty} × ${x.name}</b><b>${money(x.unit*x.qty)}</b></div><small>${x.options.map(o=>o.name+(o.price?` (+${money(o.price)})`:'')).join(' · ')||'Sin cambios'}${x.note?`<br>Nota: ${x.note}`:''}</small><button class="remove" onclick="removeItem(${x.id})">Eliminar</button></div>`).join('')+`<div style="padding-top:14px"><b>Total: ${money(total)} · ${bs(total)}</b><br><small style="color:#806f65">El envío se confirma según la zona.</small></div><button class="modal-add" style="margin-top:16px" onclick="customerForm.classList.remove('hidden')">Continuar con mis datos</button>`}
function removeItem(id){cart=cart.filter(x=>x.id!==id);updateCart();if(!cart.length){cartDialog.close()}else renderCart()}
function toggleAddress(){addressLabel.classList.toggle('hidden',delivery.value==='Retiro en el local')}
function sendWhatsApp(){let name=custName.value.trim(), phone=custPhone.value.trim(), del=delivery.value, pay=payment.value, addr=address.value.trim();if(!name||!phone||(del==='Domicilio'&&!addr)){alert('Completa tu nombre, teléfono y dirección si eliges domicilio.');return}let total=cart.reduce((a,x)=>a+x.unit*x.qty,0);let lines=['Hola, Terri Burgers. Quiero realizar este pedido:',''];cart.forEach(x=>{lines.push(`${x.qty} × ${x.name} — ${money(x.unit*x.qty)} / ${bs(x.unit*x.qty)}`);x.options.forEach(o=>lines.push(`   - ${o.name}${o.price?` (+${money(o.price)})`:''}`));if(x.note)lines.push(`   - Nota: ${x.note}`);lines.push('')});lines.push(`TOTAL: ${money(total)} / ${bs(total)}`,`Tasa usada: ${bs(1)} por US$1`,'',`Entrega: ${del}`,`Nombre: ${name}`,`Teléfono: ${phone}`);if(del==='Domicilio')lines.push(`Dirección: ${addr}`);lines.push(`Pago: ${pay}`);if(orderNote.value.trim())lines.push(`Nota adicional: ${orderNote.value.trim()}`);lines.push('','Por favor, confirmen disponibilidad y costo del envío.');window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent(lines.join('\n'))}`,'_blank')}
renderTabs();renderProducts();updateCart();
</script>
</body></html>
